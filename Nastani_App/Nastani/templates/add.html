{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="{% static 'bootstrap.css' %}">
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<div class="mt-5 container" style="width: 700px;">
    <h2>Ask For Event</h2>
    <p>Lorem ipsum dolor sit amet, consectetur adipisicing elit. Officiis, consequatur veniam pariatur itaque alias
        mollitia.</p>
    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        <div class="mb-3">
            <input type="text" name="ime" placeholder="Event Name" class="form-control">
        </div>
        <div class="mb-3">
            <input type="text" name="bendovi" placeholder="Participants" class="form-control">
        </div>
        <div class="mb-3">
            <input type="datetime-local" name="datum" class="form-control">
        </div>
        <div class="mb-3">
            <input type="text" name="lokacija" placeholder="Place" class="form-control">
        </div>
        <div class="mb-3">
            <textarea style="height: 150px;" name="opis" placeholder="Description" class="form-control"></textarea>
        </div>
        <div class="mb-3">
            <input type="file" name="slika" class="form-control">
        </div>
        <div class="d-flex flex-row-reverse">
            <button class="btn btn-dark" type="submit">Add Event</button>
        </div>
    </form>
</div>

</body>
</html>
